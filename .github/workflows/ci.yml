name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13', '22', '24']
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  gate:
    name: The gate actually gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # A gate that reports a regression and exits zero is decorative, so the
      # exit codes get asserted rather than assumed.
      - name: Exit codes are the product
        run: |
          node bin/ragbench.mjs run --dataset examples/cases.jsonl \
            --exec "node examples/fake-rag.mjs" --label main --db .ci/history.db

          cat > broken.jsonl <<'JSON'
          {"id":"settlement-timing","answer":"Overnight","retrieved":["payments/settlement.md"]}
          {"id":"refund-window","answer":"No idea","retrieved":["wrong.md"]}
          JSON

          if node bin/ragbench.mjs gate --dataset examples/cases.jsonl \
               --predictions broken.jsonl --baseline main --db .ci/history.db --no-save; then
            echo "a regression exited zero, which makes the gate decorative"
            exit 1
          fi
          echo "regression correctly failed the build"

          node bin/ragbench.mjs gate --dataset examples/cases.jsonl \
            --exec "node examples/fake-rag.mjs" --baseline main --db .ci/history.db --no-save
          echo "a clean run correctly passed"

      - name: Determinism
        run: |
          # Same inputs must give the same numbers, or "fail on a regression"
          # means nothing.
          a=$(node bin/ragbench.mjs run --dataset examples/cases.jsonl --exec "node examples/fake-rag.mjs" --json --no-save)
          b=$(node bin/ragbench.mjs run --dataset examples/cases.jsonl --exec "node examples/fake-rag.mjs" --json --no-save)
          [ "$a" = "$b" ] || { echo "two identical runs produced different numbers"; exit 1; }
          echo "identical runs produce identical numbers"

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The published tarball runs
        run: |
          npm pack --pack-destination /tmp
          mkdir /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm i /tmp/ragbench-*.tgz
          ./node_modules/.bin/ragbench --version
          ./node_modules/.bin/ragbench init --dataset c.jsonl
          echo "installed package works"
      - name: No runtime dependencies
        run: |
          count=$(node -p "Object.keys(require('./package.json').dependencies || {}).length")
          [ "$count" = "0" ] || { echo "expected zero dependencies, found $count"; exit 1; }

  action:
    name: The action runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A first run has no baseline, so the action has nothing to compare and
      # must still pass. This is what a consumer's very first build looks like.
      - id: first
        uses: ./
        with:
          dataset: examples/cases.jsonl
          exec: node examples/fake-rag.mjs
          baseline: main
          label: main
          db: .ci/history.db

      - name: A first run reports no comparison and passes
        run: |
          [ "${{ steps.first.outputs.passed }}" = "true" ] || { echo "a first run should not fail"; exit 1; }
          test -f "${{ steps.first.outputs.report }}" || { echo "no report was written"; exit 1; }

      # And the second half of the promise: a regression has to fail the job.
      - name: A regression fails the job
        run: |
          cat > broken.jsonl <<'JSON'
          {"id":"settlement-timing","answer":"Overnight","retrieved":["nope.md"]}
          {"id":"refund-window","answer":"No idea","retrieved":["wrong.md"]}
          JSON

      - id: regression
        uses: ./
        continue-on-error: true
        with:
          dataset: examples/cases.jsonl
          predictions: broken.jsonl
          baseline: main
          db: .ci/history.db
          summary: 'false'

      - name: It failed, and said so in its output
        run: |
          [ "${{ steps.regression.outcome }}" = "failure" ] || { echo "the action passed a regression"; exit 1; }
          [ "${{ steps.regression.outputs.passed }}" = "false" ] || { echo "the action did not report the failure"; exit 1; }
          echo "the action gates"
